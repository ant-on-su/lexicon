meta:
  id: de-vokabeln-schritt-6
  title: VOKABELN Schritt 6
  language: de
  translation_language: nl
  tags: [verkehr]

entries:
  - id: aber
    term: aber
    translation:
      - maar
    examples:
      - text: Ich möchte mitkommen, aber ich habe keine Zeit.
        translation: Ik wil graag mee, maar ik heb geen tijd.
        source: generated

  - id: achtung
    term: Achtung!
    translation:
      - Pas op!
    examples:
      - text: Achtung, da kommt ein Auto!
        translation: Pas op, daar komt een auto!
        source: generated

  - id: also
    term: also
    translation:
      - dus
    examples:
      - text: Es regnet, also nehme ich den Bus.
        translation: Het regent, dus ik neem de bus.
        source: generated

  - id: aufpassen_auf
    term: aufpassen auf
    translation:
      - letten op
    examples:
      - text: Pass bitte auf deinen kleinen Bruder auf!
        translation: Let alsjeblieft op je kleine broertje!
        source: generated

  - id: ausweis
    term: der Ausweis
    translation:
      - het legitimatiebewijs
    examples:
      - text: Haben Sie Ihren Ausweis dabei?
        translation: Hebt u uw legitimatiebewijs bij u?
        source: generated

  - id: autofahrer
    term: der Autofahrer
    translation:
      - de automobilist
    examples:
      - text: Der Autofahrer fährt viel zu schnell.
        translation: De automobilist rijdt veel te snel.
        source: generated

  - id: boese
    term: böse
