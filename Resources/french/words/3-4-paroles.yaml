meta:
  id: fr-4-paroles-3
  title: 3-4 PAROLES
  language: fr
  translation_language: nl

entries:
  - id: ou
    term: où
    translation:
      - waar
    examples:
      - text: Excusez-moi, où sont les toilettes ?
        translation: Pardon, waar is de wc?
        source: book
  - id: a-gauche
    term: à gauche (de)
    translation:
      - links (van), naar links
    examples:
      - text: Pour aller au cinéma, vous allez à gauche.
        translation: Om naar de bioscoop te gaan, gaat u naar links.
        source: book
  - id: a-droite
    term: à droite (de)
    translation:
      - rechts (van), naar rechts
    examples:
      - text: C’est à droite après le bar.
        translation: Het is rechts na de bar.
        source: book
  - id: en-face-de
    term: en face de
    translation:
      - tegenover
    examples:
      - text: Le gymnase est en face de la cantine.
        translation: De gymzaal is tegenover de kantine.
        source: book
  - id: a-cote-de
    term: à côté de
    translation:
      - naast
    examples:
      - text: Qui est la femme à coté de Justin Bieber ?   # CHECK: printed "coté" without circumflex in the example
        translation: Wie is de vrouw naast Justin Bieber?
        source: book
  - id: entre
    term: entre
    translation:
      - tussen
    examples:
      - text: On fait une petite pause entre deux concerts.
        translation: We houden een korte pauze tussen twee concerten.
        source: book
  - id: demander
    term: demander
    translation:
      - vragen
    examples:
      - text: Pardon, madame, je peux vous demander quelque chose ?
        translation: Pardon, mevrouw, mag ik u iets vragen?
        source: book
  - id: perdre
    term: perdre
    forms: { perfect: perdu }   # printed as "perdre, perdu"
    translation:
      - verliezen, kwijtraken
    examples:
      - text: Zut, j’ai perdu mon porte-monnaie !
        translation: Verdorie, ik ben mijn portemonnee kwijt!
        source: book
  - id: remplir
    term: remplir
    translation:
      - vullen
    examples:
      - text: Je peux remplir ma gourde ?
        translation: Mag ik mijn drinkfles vullen?
        source: book
  - id: chercher
    term: chercher
    translation:
      - zoeken
    examples:
      - text: Je cherche le magasin de souvenirs.
        translation: Ik zoek de souvenirwinkel.
        source: book
  - id: se-trouver
    term: se trouver (se trouve)
    translation:
      - zich bevinden
    examples:
      - text: Le restaurant se trouve entre la scène et la sortie.
        translation: Het restaurant ligt tussen het podium en de uitgang.
        source: book
  - id: toilettes
    term: les toilettes
    translation:
      - de wc
    examples:
      - text: Vous savez où sont les toilettes ?
        translation: Weet u waar de wc is?
        source: book
  - id: gourde
    term: la gourde
    translation:
      - de drinkfles
    examples:
      - text: Vous avez trouvé une gourde rouge ?
        translation: Hebt u een rode drinkfles gevonden?
        source: book
  - id: caisse
    term: la caisse
    translation:
      - de kassa
    examples:
      - text: Excusez-moi, où sont les caisses ?
        translation: Pardon, waar zijn de kassa's?
        source: book
  - id: point-d-eau
    term: le point d’eau
    translation:
      - het waterpunt
    examples:
      - text: Il y a un point d’eau ici ?
        translation: Is hier een waterpunt?
        source: book
  - id: carte-d-identite
    term: la carte d’identité
    translation:
      - de ID-kaart
    examples:
      - text: Il ne faut pas perdre sa carte d’identité.
        translation: Je moet je ID-kaart niet kwijtraken.
        source: book
  - id: poste-de-secours
    term: le poste de secours
    translation:
      - de hulppost, de EHBO-post
    examples:
      - text: Excusez-moi, je cherche le poste de secours.
        translation: Pardon, ik zoek de EHBO-post.
        source: book
  - id: probleme
    term: le problème
    translation:
      - het probleem
    examples:
      - text: Nous avons un petit problème.
        translation: We hebben een klein probleem.
        source: book
  - id: entree
    term: l’entrée
    translation:
      - de ingang
    examples:
      - text: Il y a beaucoup de monde devant l’entrée.
        translation: Er staan veel mensen voor de ingang.
        source: book
  - id: sortie
    term: la sortie
    translation:
      - de uitgang
    examples:
      - text: J’attends ma copine à la sortie.
        translation: Ik wacht bij de uitgang op mijn vriendin.
        source: book
